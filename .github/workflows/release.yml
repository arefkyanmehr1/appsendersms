name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'overhaul/fresh-production-fix'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Generate temporary debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          test -f "$APK"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          cp "$APK" "appsendersms-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: appsendersms-${{ github.sha }}
          path: appsendersms-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AppSendersMS ${{ github.ref_name }}
          generate_release_notes: true
          files: appsendersms-${{ github.ref_name }}.apk
